<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Onboarding - Scrapkart</title>
    <link rel="stylesheet" href="../Scrapkart/styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .onboarding-container { max-width: 600px; margin: 40px auto; background: white; padding: 40px; border-radius: 20px; box-shadow: var(--card-shadow); }
    </style>
</head>
<body style="background: #f4f7f6;">
    <div class="onboarding-container">
        <h2 style="color: #00796b; margin-bottom: 10px; text-align: center;"><i class="fas fa-clipboard-check"></i> Complete Profile</h2>
        <p style="text-align: center; color: #666; margin-bottom: 30px;">Please provide your address and Aadhar details to start accepting pickups.</p>
        
        <div id="onboardError" style="color: #f44336; background: #ffebee; padding: 10px; border-radius: 8px; margin-bottom: 15px; display: none;"></div>

        <div class="form-group">
            <label>Pincode</label>
            <input type="text" id="agentPincode" placeholder="6-digit PIN" maxlength="6" required>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>City</label>
                <input type="text" id="agentCity" placeholder="City" required>
            </div>
            <div class="form-group">
                <label>State</label>
                <input type="text" id="agentState" placeholder="State" required>
            </div>
        </div>
        <div class="form-group">
            <label>Address Line 1</label>
            <input type="text" id="agentAddressLine1" placeholder="House/Flat No., Building Name" required>
        </div>
        <div class="form-group">
            <label>Address Line 2</label>
            <input type="text" id="agentAddressLine2" placeholder="Street, Area (Optional)">
        </div>
        
        <div class="form-group">
            <label>Aadhar Card Number</label>
            <input type="text" id="agentAadhar" placeholder="12-digit Aadhar Number" maxlength="12" required>
        </div>
        
        <div class="form-group">
            <label>Upload Aadhar Card</label>
            <input type="file" id="agentAadharFile" accept="image/*,application/pdf">
        </div>

        <button class="submit-btn" onclick="submitOnboarding()" style="background-color: #00796b; margin-top: 20px;">
            Submit & Start Earning <i class="fas fa-arrow-right"></i>
        </button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="../Scrapkart/firebase-config.js"></script>
    <script>firebase.initializeApp(firebaseConfig);</script>
    <script src="script.js"></script>
    <script>
        // Check if logged in
        if (!localStorage.getItem('scrapkart_currentAgent')) {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
